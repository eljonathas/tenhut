[project]
name = "tenhut"
version = "0.1.0"
description = "Aggressive pomodoro: a pixel-art general blocks distractions until your mission is done"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/tenhut/assets/fonts/LICENSE-DejaVu.txt"]
authors = [{ name = "Jonathas Andrade" }]
requires-python = ">=3.12"
keywords = ["pomodoro", "focus", "productivity", "website-blocker", "pygame", "pixel-art"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Utilities",
]
dependencies = [
    "psutil>=7.2.2",
    "pygame-ce>=2.5.8",
]

[project.urls]
Homepage = "https://github.com/eljonathas/tenhut"
Repository = "https://github.com/eljonathas/tenhut"
Issues = "https://github.com/eljonathas/tenhut/issues"
Changelog = "https://github.com/eljonathas/tenhut/blob/main/CHANGELOG.md"

[project.scripts]
tenhut = "tenhut:main"

[project.optional-dependencies]
camera = [
    "mediapipe>=1.2.2",
    "opencv-python-headless>=5.0.0.93",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "tools"]
extend-exclude = ["packaging/build", "packaging/dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # pixel-art drawing code has long coordinate lists; the formatter wraps what it can
    "RUF001",  # the UI is in Portuguese (and uses ×, …, · on purpose)
    "RUF002",
    "RUF003",
    "SIM108",
    "B905",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
